# ════════════════════════════════════════════════════════════════════════════
#  tmux · Shokunin
#
#  Colours are tmux's theme colours (themeblue, themered, ...). Each has a
#  light and a dark value, generated from the Ghostty themes you picked, and
#  tmux swaps them when the system changes appearance.
#
#  Glyphs are Nerd Font icons; the fonts install.sh offers are all Nerd Fonts,
#  and Ghostty ships its own symbols as a fallback.
#
#  Prefix is C-Space. C-b is gone. Reload with prefix + r, cheatsheet on prefix + h.
# ════════════════════════════════════════════════════════════════════════════


# ─── knobs ────────────────────────────────────────────────────────────
#  Change these here for good, or toggle them live with the keys named on the
#  right. 1 = on, 0 = off.

set -g @show_ip     1   ;# VPN / HTB / LAN address          -- prefix + I
set -g @show_date   1   ;# date, no clock                   -- prefix + D
set -g @show_host   0   ;# hostname                         -- prefix + Y
#  @target -- the box you're on -- is deliberately not set here, so that
#  prefix + r never wipes it.    set / clear  -- prefix + t / prefix + T


# ─── core ─────────────────────────────────────────────────────────────

set  -g default-terminal 'tmux-256color'
#  Ghostty reports TERM=xterm-ghostty; `xterm*` also covers anything else.
#  RGB = truecolour, usstyle = nvim's curly/coloured diagnostic underlines,
#  extkeys = C-Enter, S-Enter etc. reach the app intact.
set -as terminal-features ',xterm*:RGB:clipboard:usstyle:strikethrough:hyperlinks:extkeys'
set  -g allow-passthrough on                          # image protocols / OSC from nested apps
set  -g extended-keys on
set  -g extended-keys-format csi-u

#  10ms rather than 0: still imperceptible in vim, but 0 lets tmux split the
#  terminal's own colour/OSC replies and leak junk like `11;rgb:...` into panes.
set  -g escape-time 10
set  -g repeat-time 400
set  -g focus-events on        # vim autoread, gitsigns etc. see focus changes
set  -g history-limit 100000
set  -g display-time 2000
set  -g display-panes-time 2000

set  -g base-index 1           # windows start at 1, matching the number row
setw -g pane-base-index 1
set  -g renumber-windows on    # no gaps after closing a window
set  -g detach-on-destroy on   # a session ending closes its tab, never jumps into another
#  Ghostty tabs mark their sessions @tab (~/.config/zsh/init.zsh); when a tab
#  closes or detaches, its sessions go with it, unless another tab shows them.
set-hook -g client-detached "run -b '~/.config/tmux/scripts/tab-closed.sh'"
setw -g aggressive-resize on

set  -g set-titles on
set  -g set-titles-string '#S · #I #W'
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_command}'

setw -g monitor-activity on
set  -g visual-activity off
set  -g bell-action none       # no audible bell, just the status flag

setw -g mode-keys vi
set  -g status-keys vi


# ─── mouse ────────────────────────────────────────────────────────────
#  On globally. Selections go through the same cleaner as `clip`, so mouse-copied
#  scan output still pastes into Obsidian without doubled or blank lines.

set -g mouse on
set -g set-clipboard on

# 3 lines a notch
bind -T copy-mode-vi WheelUpPane   send -N3 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N3 -X scroll-down

# drag to select, release to copy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel '~/.config/tmux/scripts/copy.sh'

# Double-click copies the word, triple-click copies the line -- but only when
# the program in the pane isn't itself asking for the mouse, so nvim, less and
# friends still get their own clicks.
bind -T root DoubleClick1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'select-pane -t=; copy-mode -M; send -X select-word; send -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy.sh"'
bind -T root TripleClick1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'select-pane -t=; copy-mode -M; send -X select-line; send -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy.sh"'
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe-and-cancel '~/.config/tmux/scripts/copy.sh'
bind -T copy-mode-vi TripleClick1Pane send -X select-line \; send -X copy-pipe-and-cancel '~/.config/tmux/scripts/copy.sh'

# `.` is deliberately not a separator, so a double-click grabs a whole IP
set -g word-separators ' ,|:()[]{}<>'


# ─── prefix ───────────────────────────────────────────────────────────
#  C-Space, with M-Space as a backstop in case macOS grabs C-Space for the
#  input-source switcher (System Settings > Keyboard > Keyboard Shortcuts >
#  Input Sources). Change both lines if you want something else.

unbind C-b
set -g prefix  C-Space
set -g prefix2 M-Space
bind C-Space last-window   ;# double-tap the prefix to flip to the last window
bind a       send-prefix   ;# pass the prefix through to a nested tmux


# ─── panes: vim keys, and mostly no prefix at all ─────────────────────────────────

#  No prefix -- this is the one you'll actually use. Shared with nvim: when the
#  pane is running nvim the key is handed to it, nvim moves between its own
#  splits, and at the edge it calls back out to `tmux select-pane`. One set of
#  keys for both. (The nvim half lives in ~/.config/nvim/init.lua.)
bind -n M-h if -F '#{m/r:^n?vim$,#{pane_current_command}}' 'send-keys M-h' 'select-pane -L'
bind -n M-j if -F '#{m/r:^n?vim$,#{pane_current_command}}' 'send-keys M-j' 'select-pane -D'
bind -n M-k if -F '#{m/r:^n?vim$,#{pane_current_command}}' 'send-keys M-k' 'select-pane -U'
bind -n M-l if -F '#{m/r:^n?vim$,#{pane_current_command}}' 'send-keys M-l' 'select-pane -R'

# with prefix, repeatable. Left is C-h, because plain h opens the cheatsheet.
bind -r C-h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 4
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 4
bind -n M-H resize-pane -L 4   ;# Cmd+Shift+h/j/k/l in Ghostty
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 4

# splits keep the current directory; :vs and :sp muscle memory both work
#
#  Naming, since tmux and vim disagree about it:
#      panes SIDE BY SIDE  = tmux -h = vim :vsplit = "vertical"    -- | \ v
#      panes STACKED       = tmux -v = vim :split  = "horizontal"  -- - s
#
unbind '"'
unbind %
bind | split-window -h  -c '#{pane_current_path}'   ;# vertical   -- side by side
bind \\ split-window -h  -c '#{pane_current_path}'
bind v split-window -h  -c '#{pane_current_path}'
bind - split-window -v  -c '#{pane_current_path}'   ;# horizontal -- stacked
bind s split-window -v  -c '#{pane_current_path}'
bind _ split-window -fv -c '#{pane_current_path}'   ;# full-width split
bind -n M-| split-window -h -c '#{pane_current_path}'  ;# Cmd+D in Ghostty
bind -n M-_ split-window -v -c '#{pane_current_path}'  ;# Cmd+Shift+D in Ghostty
bind + split-window -fh -c '#{pane_current_path}'   ;# full-height split

#  Automatic split, bspwm-style: picks the pane's longer side for you, so you
#  stop thinking about direction and just keep hitting one key. tmux has no
#  native equivalent, so this is done in scripts/split.sh -- see the comment at
#  the top of that file for the cell-aspect fudge factor.
bind    o       run-shell '~/.config/tmux/scripts/split.sh auto'
bind -n M-Enter run-shell '~/.config/tmux/scripts/split.sh auto'

bind Space next-layout
bind x     swap-pane -D
bind X     confirm-before -p 'kill pane #P? (y/n)' kill-pane
bind !     break-pane                               ;# pane -> its own window
bind @     join-pane                                ;# pull the last pane back in


# ─── windows and sessions ───────────────────────────────────────────

bind c new-window -c '#{pane_current_path}'

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-n next-window
bind -n M-p previous-window

bind -r '<' swap-window -d -t -1
bind -r '>' swap-window -d -t +1

bind w choose-tree -Zw          ;# window picker
bind f choose-tree -Zs          ;# session picker
bind R command-prompt -I '#S' 'rename-session -- "%%"'
bind N command-prompt -p ' new session:' 'new-session -s "%%" ; set -F @tab "#{client_tty}"'
bind Q confirm-before -p 'kill session #S? (y/n)' kill-session


# ─── copy mode, vi-style ────────────────────────────────────────────

bind Escape copy-mode
bind /      copy-mode \; command-prompt -ip ' search:' -T search 'send -X search-backward "%%"'
bind p      paste-buffer -p
bind C-p    choose-buffer -Z

bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi V      send -X select-line
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel '~/.config/tmux/scripts/copy.sh'
bind -T copy-mode-vi Y      send -X copy-pipe-end-of-line-and-cancel '~/.config/tmux/scripts/copy.sh'
bind -T copy-mode-vi Enter  send -X copy-pipe-and-cancel '~/.config/tmux/scripts/copy.sh'
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q      send -X cancel
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line


# ─── the target box ──────────────────────────────────────────────
#  Mirrors the `$ip` convention the zsh prompt uses. Set it from the shell with
#      tmux set -g @target "$ip"
#  or interactively with prefix + t. prefix + T clears it.

bind t command-prompt -p ' target:' -I '#{@target}' 'set -g @target "%%"'
bind T set -g @target '' \; display-message ' target cleared'


# ─── toggles ─────────────────────────────────────────────────

bind r source-file ~/.config/tmux/tmux.conf \; display-message ' tmux.conf reloaded'
bind m set -g mouse \; display-message ' mouse #{?mouse,on,off}'
bind S setw synchronize-panes \; display-message ' sync #{?pane_synchronized,on,off}'
bind B set -g status \; display-message ' status #{?status,on,off}'
bind P if -F '#{@border_titles}' 'set -g @border_titles 0 ; set -g pane-border-status off' 'set -g @border_titles 1 ; set -g pane-border-status top'
bind I if -F '#{@show_ip}'   'set -g @show_ip 0'   'set -g @show_ip 1'
bind D if -F '#{@show_date}' 'set -g @show_date 0' 'set -g @show_date 1'
bind Y if -F '#{@show_host}' 'set -g @show_host 0' 'set -g @show_host 1'

bind C-l send-keys C-l \; clear-history \; display-message ' scrollback cleared'


# ─── popups ─────────────────────────────────────────────────

bind Enter display-popup -E -w 80% -h 80% -d '#{pane_current_path}'
bind e     display-popup -E -w 80% -h 80% '${EDITOR:-nvim} ~/.config/tmux/tmux.conf'
bind h     display-popup -E -w 90 -h 90% "~/.config/tmux/scripts/cheatsheet.sh | less -R"
#  No prefix: Cmd+/ or Cmd+? in Ghostty (sent as M-?), or left Option + / or ?.
bind -n M-? display-popup -E -w 90 -h 90% "~/.config/tmux/scripts/cheatsheet.sh | less -R"
bind -n M-/ display-popup -E -w 90 -h 90% "~/.config/tmux/scripts/cheatsheet.sh | less -R"
bind ?     display-popup -E -w 70% -h 80% "tmux list-keys -N | sort | less -R"
bind g     display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit
bind U     display-popup -E -w 80% -h 70% "~/.config/tmux/scripts/updates.sh --upgrade"


# ════════════════════════════════════════════════════════════════════════════
#  Theme
# ════════════════════════════════════════════════════════════════════════════

# ─── light / dark ─────────────────────────────────────────────────────────
#  Colour values come from the two themes picked in install.sh, generated into
#  ~/.config/shokunin/tmux-theme.conf. `appearance --tmux` sets `theme` to
#  match the system (or the always-light/dark choice); Ghostty's appearance
#  reports re-run it. The status bar reads `theme` to show the sun or moon.

source-file -q ~/.config/shokunin/tmux-theme.conf
run '~/.local/bin/appearance --tmux'
set-hook -g client-light-theme "run -b '~/.local/bin/appearance --tmux'"
set-hook -g client-dark-theme  "run -b '~/.local/bin/appearance --tmux'"

# ─── panes, messages, popups, menus ──────────────────────────────────────

set -g pane-border-lines single
set -g pane-border-indicators colour
set -g pane-border-style        'fg=themelightgrey'
#  The active border is set further down, in the copy-mode block -- it changes
#  colour when the pane is in copy mode, so it has to be a format, not a colour.
set -g display-panes-colour        'themedarkgrey'
set -g display-panes-active-colour 'thememagenta'

set -g pane-border-status off
set -g pane-border-format ' #[fg=themeblue]#P #[fg=themedarkgrey]#{pane_current_command} '

set -g message-style         'fg=themewhite,bg=themeblue,bold'
set -g message-command-style 'fg=themeblue,bg=themelightgrey,bold'

set -g popup-style        'bg=default'
set -g popup-border-style 'fg=themeblue'
set -g popup-border-lines rounded

set -g menu-style          'fg=themeblack,bg=default'
set -g menu-selected-style 'fg=themewhite,bg=themeblue,bold'
set -g menu-border-style   'fg=themeblue'
set -g menu-border-lines   rounded

set -g clock-mode-colour 'thememagenta'
set -g clock-mode-style 12

# ─── copy mode: make the selection impossible to miss ─────────────────
#  Three separate things are styled here, and they used to all be one. That was
#  the problem: `mode-style` alone drives the selection, the position counter and
#  the mode pill at once, so a drag-select looked exactly like the rest of the
#  pane and you couldn't tell what you'd grabbed.
#
#    mode-style                    blue    -- the "you are in a mode" wash
#    copy-mode-selection-style     MAGENTA -- the text actually selected
#    copy-mode-match-style         cyan    -- every search hit
#    copy-mode-current-match-style yellow  -- the hit the cursor is on
#
#  Each of these is a different fill, so selected text can never be confused
#  with a search hit, the mode pill, or a marked line.

setw -g mode-style                    'fg=themewhite,bg=themeblue'
setw -g copy-mode-selection-style     'fg=themewhite,bg=thememagenta,bold'
setw -g copy-mode-match-style         'fg=themewhite,bg=themecyan'
setw -g copy-mode-current-match-style 'fg=themewhite,bg=themeyellow,bold'
setw -g copy-mode-mark-style          'fg=themewhite,bg=themegreen'
setw -g copy-mode-position-style      'fg=themewhite,bg=themeblue,bold'

#  Line numbers are off by default -- toggle them with C-n inside copy mode when
#  you want to reference a line rather than copy it.
setw -g copy-mode-line-numbers off
setw -g copy-mode-line-number-style         'fg=themedarkgrey'
setw -g copy-mode-current-line-number-style 'fg=themeyellow,bold'
bind -T copy-mode-vi C-n setw copy-mode-line-numbers \; display-message ' copy-mode line numbers toggled'

#  Second, coarser cue: the active pane's border goes yellow the moment you enter
#  copy mode, so you can see it from across the screen without reading the pill.
set -g pane-active-border-style '#{?pane_in_mode,fg=themeyellow,fg=themeblue}'

# ─── status bar ───────────────────────────────────────────────
#  bg=default so the bar floats on the terminal background instead of sitting in
#  a slab of its own colour -- that is what makes the rounded caps read as pills.
#  Move it up with `set -g status-position top`.

#  Two rows: a blank spacer, then the bar, so the prompt never sits flush
#  against it. Reset first so prefix + r doesn't copy an already-blank row.
set -g status 2
set -gu status-format
set -gF status-format[1] '#{status-format[0]}'
set -g status-format[0] ''
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default,fg=themedarkgrey'
set -g status-left-length  120
set -g status-right-length 200

# Session pill. Blue normally, magenta while the prefix is live, so you always
# know whether tmux is listening.
set -g status-left "\
#{?client_prefix,\
#[fg=thememagenta]#[bg=default]#[fg=themewhite]#[bg=thememagenta]#[bold]  #S #[fg=thememagenta]#[bg=default]#[nobold],\
#[fg=themeblue]#[bg=default]#[fg=themewhite]#[bg=themeblue]#[bold]  #S #[fg=themeblue]#[bg=default]#[nobold]}\
#{?pane_in_mode, #[fg=themeyellow]#[bg=default]#[fg=themewhite]#[bg=themeyellow]#[bold]  #{pane_mode} #[fg=themeyellow]#[bg=default]#[nobold],}\
#{?pane_synchronized, #[fg=themered]#[bg=default]#[fg=themewhite]#[bg=themered]#[bold]  sync #[fg=themered]#[bg=default]#[nobold],}\
 "

# Windows. Flags:  zoomed,  bell, ● activity.
set -g window-status-separator ''
set -g window-status-format "\
#[fg=themedarkgrey]#[bg=default] #I #[fg=themedarkgrey]#W\
#{?window_zoomed_flag,#[fg=themeyellow] ,}\
#{?window_bell_flag,#[fg=themered] ,}\
#{?window_activity_flag,#[fg=themeyellow] ●,} "
set -g window-status-current-format "\
#[fg=themelightgrey]#[bg=default]#[fg=thememagenta]#[bg=themelightgrey]#[bold] #I #[fg=themeblack]#W\
#{?window_zoomed_flag,#[fg=themeyellow] ,}\
#{?window_bell_flag,#[fg=themered] ,}\
 #[fg=themelightgrey]#[bg=default]#[nobold]"
set -g window-status-activity-style none
set -g window-status-bell-style     none

# Right: outdated packages (only when there are some), the split/close
# buttons, target box, whichever IP matters, then the date. No clock.
set -g status-right "\
#(~/.config/tmux/scripts/updates.sh)\
 #[fg=themelightgrey]#[bg=default]#[fg=themecyan]#[bg=themelightgrey]#[range=user|split-v]  #[norange]#[range=user|split-h] #[norange]#[fg=themered]#[range=user|pane-close] #[norange]#[fg=themelightgrey]#[bg=default]\
#{?#{@target}, #[fg=thememagenta]#[bg=default]#[fg=themewhite]#[bg=thememagenta]#[bold]  #{@target} #[fg=thememagenta]#[bg=default]#[nobold],}\
#{?#{@show_ip}, #(~/.config/tmux/scripts/netinfo.sh),}\
#{?#{@show_date}, #[fg=themelightgrey]#[bg=default]#[fg=themecyan]#[bg=themelightgrey] #{?#{==:#{theme},dark},#[fg=themeblue],#[fg=themeyellow]} #[fg=themeblack]%a %d %b #[fg=themelightgrey]#[bg=default],}\
#{?#{@show_host}, #[fg=themelightgrey]#[bg=default]#[fg=themeblue]#[bg=themelightgrey]  #[fg=themeblack]#h #[fg=themelightgrey]#[bg=default],}\
 "


# ─── status-bar buttons ──────────────────────────────────────────────
#  Three clickable cells at the right-hand end of the bar. All three glyphs are
#  Codicons (U+EB56 / U+EB57 / U+EA76), so they share a weight and read as one
#  set -- box-drawing characters were tried first and looked wrong, because they
#  are cell-FILLING connectors and render as full-height strokes inside a pill
#  rather than as icons.
#
#      EB56   split vertically   -- new pane to the right
#      EB57   split horizontally -- new pane underneath
#      EA76   close this pane    -- asks first if something's running in it
#
#  A click anywhere else on the bar still selects the window, exactly as before.

bind -T root MouseDown1Status {
  if -F '#{==:#{mouse_status_range},updates}' {
    display-popup -E -w 80% -h 70% "~/.config/tmux/scripts/updates.sh --upgrade"
  } {
  if -F '#{==:#{mouse_status_range},split-v}' {
    run-shell '~/.config/tmux/scripts/split.sh vertical'
  } {
    if -F '#{==:#{mouse_status_range},split-h}' {
      run-shell '~/.config/tmux/scripts/split.sh horizontal'
    } {
      if -F '#{==:#{mouse_status_range},pane-close}' {
        # A bare shell closes straight away; anything running asks first
        if -F '#{m/r:^(zsh|bash|sh)$,#{pane_current_command}}' {
          kill-pane
        } {
          confirm-before -p 'kill #{pane_current_command} in pane #P? (y/n)' kill-pane
        }
      } {
        switch-client -t =
      }
    }
  }
  }
}
